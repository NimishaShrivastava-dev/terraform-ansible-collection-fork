---
- name: Set module defaults
  module_defaults:
    group/hashicorp.terraform.terraform:
      tfe_token: "{{ tfc_token }}"

  block:
    - name: Generate a unique ID
      ansible.builtin.set_fact:
        unique_id: "{{ lookup('pipe', 'uuidgen') | lower }}"

    - name: Generate a unique policy set name
      ansible.builtin.set_fact:
        policy_set_name: "polset-ver-test-{{ unique_id[:8] }}"
        # role_path is set automatically when this target runs under ansible-test
        # integration (each target is a role); policy_set_version_target_dir lets
        # a non-role runner (e.g. a local include_tasks-based smoke test) override it.
        policy_files_dir: "{{ policy_set_version_target_dir | default(role_path) }}/files/policies"

    # ---------- fixture: a non-VCS-backed policy set to version ----------
    - name: Create a fixture (non-VCS-backed) policy set
      hashicorp.terraform.policy_set:
        organization: "{{ organization }}"
        name: "{{ policy_set_name }}"
        kind: sentinel
        global: false
        state: present
      register: result_policy_set

    - name: Save policy_set_id fact
      ansible.builtin.set_fact:
        policy_set_id: "{{ result_policy_set.id }}"

    # ---------- create + upload ----------
    - name: Create and upload a new policy set version
      hashicorp.terraform.policy_set_version:
        policy_set_id: "{{ policy_set_id }}"
        policy_files_path: "{{ policy_files_dir }}"
        poll_interval: 3
        poll_timeout: 60
      register: result_version

    - name: Assert the version was created and reached a terminal status
      ansible.builtin.assert:
        that:
          - result_version.changed
          - result_version.id is defined
          - result_version.status in ["ready", "errored"]

    # ---------- info lookup ----------
    - name: Look up the policy set version by ID
      hashicorp.terraform.policy_set_version_info:
        policy_set_version_id: "{{ result_version.id }}"
      register: result_info

    - name: Assert info matches
      ansible.builtin.assert:
        that:
          - result_info.policy_set_version.id == result_version.id
          - result_info.policy_set_version.status == result_version.status

  always:
    - name: Cleanup - best-effort delete the fixture policy set
      hashicorp.terraform.policy_set:
        organization: "{{ organization }}"
        name: "{{ policy_set_name }}"
        state: absent
      when: policy_set_name is defined
      failed_when: false
