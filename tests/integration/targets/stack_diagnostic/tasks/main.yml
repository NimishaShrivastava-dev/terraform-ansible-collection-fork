---
- name: Set module defaults
  module_defaults:
    group/hashicorp.terraform.terraform:
      tfe_token: "{{ tfc_token }}"

  block:
    - name: Retrieve stack diagnostic
      hashicorp.terraform.stack_diagnostic_info:
        stack_diagnostic_id: "{{ stack_diagnostic_id }}"
      register: result

    - name: Assert stack diagnostic was returned
      ansible.builtin.assert:
        that:
          - not result.changed
          - result.stack_diagnostic.id == stack_diagnostic_id
          - result.stack_diagnostic.severity is defined
          - result.stack_diagnostic.summary is defined

    - name: Test nonexistent stack diagnostic ID
      hashicorp.terraform.stack_diagnostic_info:
        stack_diagnostic_id: "std-doesnotexist123456789"
      register: missing_result
      ignore_errors: true

    - name: Assert nonexistent stack diagnostic fails appropriately
      ansible.builtin.assert:
        that:
          - missing_result.failed
          - '"not found" in missing_result.msg | lower'
