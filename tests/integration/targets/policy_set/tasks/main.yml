---
- name: Set module defaults
  module_defaults:
    group/hashicorp.terraform.terraform:
      tfe_token: "{{ tfc_token }}"

  block:
    - name: Generate a unique ID
      ansible.builtin.set_fact:
        unique_id: "{{ lookup('pipe', 'uuidgen') | lower }}"

    - name: Generate unique fixture/set names
      ansible.builtin.set_fact:
        policy_set_name: "policy-set-test-{{ unique_id[:8] }}"
        policy_a_name: "policy-set-test-a-{{ unique_id[:8] }}"
        policy_b_name: "policy-set-test-b-{{ unique_id[:8] }}"

    # ---------- fixtures: two individual policies to attach ----------
    - name: Create policy A
      hashicorp.terraform.policy:
        organization: "{{ organization }}"
        name: "{{ policy_a_name }}"
        kind: sentinel
        enforcement_level: advisory
        policy_content: "main = rule { true }"
        state: present
      register: result_policy_a

    - name: Create policy B
      hashicorp.terraform.policy:
        organization: "{{ organization }}"
        name: "{{ policy_b_name }}"
        kind: sentinel
        enforcement_level: advisory
        policy_content: "main = rule { true }"
        state: present
      register: result_policy_b

    - name: Save policy id facts
      ansible.builtin.set_fact:
        policy_a_id: "{{ result_policy_a.id }}"
        policy_b_id: "{{ result_policy_b.id }}"

    # ---------- create ----------
    - name: Create a policy set with policy A attached
      hashicorp.terraform.policy_set:
        organization: "{{ organization }}"
        name: "{{ policy_set_name }}"
        kind: sentinel
        global: false
        policy_ids:
          - "{{ policy_a_id }}"
        state: present
      register: result_create

    - name: Assert policy set creation was successful
      ansible.builtin.assert:
        that:
          - result_create.changed
          - result_create.id is defined
          - result_create.name == policy_set_name
          - (result_create.policies | map(attribute='id') | list) == [policy_a_id]

    - name: Save policy_set_id fact
      ansible.builtin.set_fact:
        policy_set_id: "{{ result_create.id }}"

    # ---------- idempotent re-apply with identical membership ----------
    - name: Idempotency test - re-apply with the same policy membership
      hashicorp.terraform.policy_set:
        policy_set_id: "{{ policy_set_id }}"
        policy_ids:
          - "{{ policy_a_id }}"
        state: present
      register: result_reapply

    - name: Assert re-apply was a no-op
      ansible.builtin.assert:
        that:
          - not result_reapply.changed

    # ---------- kind drift fails ----------
    - name: Attempt state=present with a drifted kind (expected to fail)
      hashicorp.terraform.policy_set:
        policy_set_id: "{{ policy_set_id }}"
        kind: opa
        state: present
      register: result_kind_drift
      ignore_errors: true

    - name: Assert kind drift fails with a clear message
      ansible.builtin.assert:
        that:
          - result_kind_drift.failed
          - "'immutable' in result_kind_drift.msg"

    # ---------- relationship sync: swap policy A for policy B ----------
    - name: Swap policy A for policy B in the set
      hashicorp.terraform.policy_set:
        policy_set_id: "{{ policy_set_id }}"
        policy_ids:
          - "{{ policy_b_id }}"
        state: present
      register: result_swap

    - name: Assert the membership swap was applied
      ansible.builtin.assert:
        that:
          - result_swap.changed
          - (result_swap.policies | map(attribute='id') | list) == [policy_b_id]

    # ---------- info lookups ----------
    - name: Look up the policy set by ID
      hashicorp.terraform.policy_set_info:
        policy_set_id: "{{ policy_set_id }}"
      register: result_info_by_id

    - name: Assert info-by-id matches
      ansible.builtin.assert:
        that:
          - result_info_by_id.policy_set.id == policy_set_id
          - (result_info_by_id.policy_set.policies | map(attribute='id') | list) == [policy_b_id]

    - name: Look up the policy set by organization and name
      hashicorp.terraform.policy_set_info:
        organization: "{{ organization }}"
        name: "{{ policy_set_name }}"
      register: result_info_by_name

    - name: Assert info-by-name matches
      ansible.builtin.assert:
        that:
          - result_info_by_name.policy_set.id == policy_set_id

    # ---------- absent ----------
    - name: Check-mode delete
      hashicorp.terraform.policy_set:
        policy_set_id: "{{ policy_set_id }}"
        state: absent
      check_mode: true
      register: result_check_mode

    - name: Assert check-mode reports change without applying
      ansible.builtin.assert:
        that:
          - result_check_mode.changed
          - "'check mode' in result_check_mode.msg"

    - name: Delete the policy set
      hashicorp.terraform.policy_set:
        policy_set_id: "{{ policy_set_id }}"
        state: absent
      register: result_delete

    - name: Assert delete was successful
      ansible.builtin.assert:
        that:
          - result_delete.changed
          - "'deleted' in result_delete.msg"

    - name: Delete the same policy set again (no-op)
      hashicorp.terraform.policy_set:
        policy_set_id: "{{ policy_set_id }}"
        state: absent
      register: result_delete_again

    - name: Assert second delete was a no-op
      ansible.builtin.assert:
        that:
          - not result_delete_again.changed

  always:
    - name: Cleanup - best-effort delete leftover policy set by name (in case of mid-run failure)
      hashicorp.terraform.policy_set:
        organization: "{{ organization }}"
        name: "{{ policy_set_name }}"
        state: absent
      when: policy_set_name is defined
      failed_when: false

    - name: Cleanup - best-effort delete fixture policies by name
      hashicorp.terraform.policy:
        organization: "{{ organization }}"
        name: "{{ item }}"
        state: absent
      loop:
        - "{{ policy_a_name | default('') }}"
        - "{{ policy_b_name | default('') }}"
      when: item | length > 0
      failed_when: false
