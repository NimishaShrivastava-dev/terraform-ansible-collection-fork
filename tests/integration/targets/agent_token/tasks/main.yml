---
- name: Set module defaults
  module_defaults:
    group/hashicorp.terraform.terraform:
      tfe_token: "{{ tfc_token }}"

  block:
    - name: Generate a unique ID
      ansible.builtin.set_fact:
        unique_id: "{{ lookup('pipe', 'uuidgen') }}"

    - name: Generate a unique agent pool name for this test run
      ansible.builtin.set_fact:
        agent_pool_name: "agent-token-test-{{ unique_id[:8] }}"

    # ---------- prerequisite: agent pool ----------
    - name: Create an agent pool for the token tests
      hashicorp.terraform.agent_pool:
        organization: "{{ organization }}"
        name: "{{ agent_pool_name }}"
        state: present
      register: result_pool

    - name: Save agent_pool_id fact
      ansible.builtin.set_fact:
        test_agent_pool_id: "{{ result_pool.id }}"

    # ---------- create ----------
    - name: Create an agent token
      hashicorp.terraform.agent_token:
        agent_pool_id: "{{ test_agent_pool_id }}"
        description: "ci-runner-{{ unique_id[:8] }}"
        state: present
      register: result_create

    - name: Assert agent token creation was successful
      ansible.builtin.assert:
        that:
          - result_create.changed
          - result_create.id is defined
          - result_create.description is defined
          - result_create.token is defined

    - name: Save agent_token_id fact
      ansible.builtin.set_fact:
        agent_token_id: "{{ result_create.id }}"

    # ---------- check-mode create ----------
    - name: Check-mode create an agent token (no actual token created)
      hashicorp.terraform.agent_token:
        agent_pool_id: "{{ test_agent_pool_id }}"
        description: "check-mode-token-{{ unique_id[:8] }}"
        state: present
      check_mode: true
      register: result_check_mode_create

    - name: Assert check-mode create reports change without writing
      ansible.builtin.assert:
        that:
          - result_check_mode_create.changed
          - "'check mode' in result_check_mode_create.msg"
          - result_check_mode_create.id is not defined

    # ---------- idempotent re-present by ID ----------
    - name: Idempotency test - verify the same agent token by ID
      hashicorp.terraform.agent_token:
        agent_token_id: "{{ agent_token_id }}"
        state: present
      register: result_idempotent

    - name: Assert re-present was a no-op and token value is not re-exposed
      ansible.builtin.assert:
        that:
          - not result_idempotent.changed
          - result_idempotent.id == agent_token_id
          - result_idempotent.token is not defined

    # ---------- info ----------
    - name: Get the agent token info by ID
      hashicorp.terraform.agent_token_info:
        agent_token_id: "{{ agent_token_id }}"
      register: result_info

    - name: Assert info lookup returned the token
      ansible.builtin.assert:
        that:
          - result_info.agent_token.id == agent_token_id
          - result_info.agent_token.description is defined
          - not result_info.changed

    # ---------- info not-found ----------
    - name: Attempt to look up a non-existent agent token (must fail)
      hashicorp.terraform.agent_token_info:
        agent_token_id: "at-0000000000000000"
      register: result_info_missing
      ignore_errors: true

    - name: Assert info not-found error was raised
      ansible.builtin.assert:
        that:
          - result_info_missing is failed

    # ---------- check-mode delete ----------
    - name: Check-mode delete the agent token
      hashicorp.terraform.agent_token:
        agent_token_id: "{{ agent_token_id }}"
        state: absent
      check_mode: true
      register: result_check_mode

    - name: Assert check-mode reports change without applying
      ansible.builtin.assert:
        that:
          - result_check_mode.changed
          - "'check mode' in result_check_mode.msg"

    # ---------- delete ----------
    - name: Delete the agent token
      hashicorp.terraform.agent_token:
        agent_token_id: "{{ agent_token_id }}"
        state: absent
      register: result_delete

    - name: Assert delete was successful
      ansible.builtin.assert:
        that:
          - result_delete.changed
          - "'deleted' in result_delete.msg"

    # ---------- idempotent delete ----------
    - name: Delete the same agent token again (no-op)
      hashicorp.terraform.agent_token:
        agent_token_id: "{{ agent_token_id }}"
        state: absent
      register: result_delete_again

    - name: Assert second delete was a no-op
      ansible.builtin.assert:
        that:
          - not result_delete_again.changed
          - "'absent' in result_delete_again.msg"

  always:
    - name: Cleanup - best-effort delete the agent pool
      hashicorp.terraform.agent_pool:
        organization: "{{ organization }}"
        name: "{{ agent_pool_name | default('') }}"
        state: absent
      when: agent_pool_name is defined and agent_pool_name | length > 0
      failed_when: false
