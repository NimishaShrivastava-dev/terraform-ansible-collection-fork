---
- name: Set module defaults
  module_defaults:
    group/hashicorp.terraform.terraform:
      tfe_token: "{{ tfc_token }}"

  block:
    - name: Generate a unique ID
      ansible.builtin.set_fact:
        unique_id: "{{ lookup('pipe', 'uuidgen') }}"

    - name: Generate a unique team name
      ansible.builtin.set_fact:
        team_name: "tt-test-{{ unique_id[:8] }}"

    # ---------- create a team to work with ----------
    - name: Create a team for token testing
      hashicorp.terraform.team:
        name: "{{ team_name }}"
        organization: "{{ organization }}"
        visibility: "secret"
        state: present
      register: team_result

    - name: Save team ID
      ansible.builtin.set_fact:
        test_team_id: "{{ team_result.id }}"

    # ================================================================
    # TEAM TOKEN LIFECYCLE (team_id)
    # ================================================================

    # ---------- state=present: create team token ----------
    - name: Create the team token
      hashicorp.terraform.team_token:
        team_id: "{{ test_team_id }}"
        state: present
      register: result_create
      no_log: true

    - name: Assert token was created
      ansible.builtin.assert:
        that:
          - result_create.changed
          - result_create.id is defined

    # ---------- idempotency: same state=present returns changed=False ----------
    - name: Idempotency test - state=present with existing token
      hashicorp.terraform.team_token:
        team_id: "{{ test_team_id }}"
        state: present
      register: result_create_again
      no_log: true

    - name: Assert second state=present was a no-op
      ansible.builtin.assert:
        that:
          - not result_create_again.changed

    # ---------- info: read by team_id ----------
    - name: Read the token by team_id
      hashicorp.terraform.team_token_info:
        team_id: "{{ test_team_id }}"
      register: result_info_team_id

    - name: Assert info returned the token
      ansible.builtin.assert:
        that:
          - result_info_team_id.team_token is defined
          - result_info_team_id.team_token.id is defined
          - not result_info_team_id.changed

    - name: Save token ID for further tests
      ansible.builtin.set_fact:
        created_token_id: "{{ result_info_team_id.team_token.id }}"

    # ---------- info: read by token_id ----------
    - name: Read the token by token_id
      hashicorp.terraform.team_token_info:
        token_id: "{{ created_token_id }}"
      register: result_info_token_id

    - name: Assert token-id lookup returned the same token
      ansible.builtin.assert:
        that:
          - result_info_token_id.team_token.id == created_token_id
          - not result_info_token_id.changed

    # ---------- check-mode delete ----------
    - name: Check-mode delete by team_id
      hashicorp.terraform.team_token:
        team_id: "{{ test_team_id }}"
        state: absent
      check_mode: true
      register: result_check_mode

    - name: Assert check-mode reports change without deleting
      ansible.builtin.assert:
        that:
          - result_check_mode.changed
          - "'check mode' in result_check_mode.msg"

    # Verify token still exists after check-mode delete
    - name: Verify token still present after check-mode
      hashicorp.terraform.team_token_info:
        team_id: "{{ test_team_id }}"
      register: result_still_present

    - name: Assert token is still present
      ansible.builtin.assert:
        that:
          - result_still_present.team_token.id is defined

    # ---------- delete by team_id ----------
    - name: Delete the team token by team_id
      hashicorp.terraform.team_token:
        team_id: "{{ test_team_id }}"
        state: absent
      register: result_delete

    - name: Assert delete was successful
      ansible.builtin.assert:
        that:
          - result_delete.changed
          - "'deleted' in result_delete.msg"

    # ---------- idempotent delete: already absent ----------
    - name: Delete the token again (no-op)
      hashicorp.terraform.team_token:
        team_id: "{{ test_team_id }}"
        state: absent
      register: result_delete_again

    - name: Assert second delete was a no-op
      ansible.builtin.assert:
        that:
          - not result_delete_again.changed
          - "'absent' in result_delete_again.msg"

    # ================================================================
    # NAMED TOKEN LIFECYCLE (token_id delete flow)
    # ================================================================

    # ---------- create named token ----------
    - name: Create a named team token with description
      hashicorp.terraform.team_token:
        team_id: "{{ test_team_id }}"
        description: "integration-test-token-{{ unique_id[:8] }}"
        state: present
      register: result_named_create
      no_log: true

    - name: Assert named token was created
      ansible.builtin.assert:
        that:
          - result_named_create.changed
          - result_named_create.id is defined

    - name: Save named token ID
      ansible.builtin.set_fact:
        named_token_id: "{{ result_named_create.id }}"

    # ---------- info: read named token by token_id ----------
    - name: Read the named token by token_id
      hashicorp.terraform.team_token_info:
        token_id: "{{ named_token_id }}"
      register: result_named_info

    - name: Assert named token info matches
      ansible.builtin.assert:
        that:
          - result_named_info.team_token.id == named_token_id
          - not result_named_info.changed

    # ---------- check-mode delete by token_id ----------
    - name: Check-mode delete named token by token_id
      hashicorp.terraform.team_token:
        token_id: "{{ named_token_id }}"
        state: absent
      check_mode: true
      register: result_named_check_mode

    - name: Assert check-mode reports change without deleting named token
      ansible.builtin.assert:
        that:
          - result_named_check_mode.changed
          - "'check mode' in result_named_check_mode.msg"

    # Verify named token still exists after check-mode delete
    - name: Verify named token still present after check-mode
      hashicorp.terraform.team_token_info:
        token_id: "{{ named_token_id }}"
      register: result_named_still_present

    - name: Assert named token is still present
      ansible.builtin.assert:
        that:
          - result_named_still_present.team_token.id == named_token_id

    # ---------- delete named token by token_id ----------
    - name: Delete the named token by token_id
      hashicorp.terraform.team_token:
        token_id: "{{ named_token_id }}"
        state: absent
      register: result_named_delete

    - name: Assert named token delete was successful
      ansible.builtin.assert:
        that:
          - result_named_delete.changed
          - "'deleted' in result_named_delete.msg"

    # ---------- idempotent delete by token_id: already absent ----------
    - name: Delete the named token again by token_id (no-op)
      hashicorp.terraform.team_token:
        token_id: "{{ named_token_id }}"
        state: absent
      register: result_named_delete_again

    - name: Assert second named delete was a no-op
      ansible.builtin.assert:
        that:
          - not result_named_delete_again.changed
          - "'absent' in result_named_delete_again.msg"

    # Verify named token is gone via info module.
    # Allow the task to fail (failed_when: false), then assert the failure is
    # specifically a not-found error — not an auth or network failure.
    - name: Verify named token is absent via info module
      hashicorp.terraform.team_token_info:
        token_id: "{{ named_token_id }}"
      register: result_named_gone
      failed_when: false

    - name: Assert info module fails with not-found for absent named token
      ansible.builtin.assert:
        that:
          - result_named_gone is failed
          - result_named_gone.msg is defined
          - "'not found' in result_named_gone.msg | lower"
        fail_msg: >-
          Expected team_token_info to fail with a not-found message for absent
          token {{ named_token_id }}, got: {{ result_named_gone.msg | default('(no msg)') }}

    # ================================================================
    # TEAM TOKEN WITH expired_at
    # ================================================================

    # ---------- create team token with expired_at ----------
    - name: Create a team token with expired_at (no description)
      hashicorp.terraform.team_token:
        team_id: "{{ test_team_id }}"
        expired_at: "2099-12-31T00:00:00Z"
        state: present
      register: result_expiry_create
      no_log: true

    - name: Assert token with expired_at was created
      ansible.builtin.assert:
        that:
          - result_expiry_create.changed
          - result_expiry_create.id is defined

    - name: Save expired_at token ID
      ansible.builtin.set_fact:
        expiry_token_id: "{{ result_expiry_create.id }}"

    # ---------- read the token ----------
    - name: Read the token by team_id
      hashicorp.terraform.team_token_info:
        team_id: "{{ test_team_id }}"
      register: result_expiry_info

    - name: Assert token can be read
      ansible.builtin.assert:
        that:
          - result_expiry_info.team_token.id is defined
          - not result_expiry_info.changed

    # ---------- idempotency: same state=present with expired_at is a no-op ----------
    - name: Idempotency test - state=present with expired_at and existing token
      hashicorp.terraform.team_token:
        team_id: "{{ test_team_id }}"
        expired_at: "2099-12-31T00:00:00Z"
        state: present
      register: result_expiry_idem
      no_log: true

    - name: Assert idempotent re-run was a no-op
      ansible.builtin.assert:
        that:
          - not result_expiry_idem.changed

    # ---------- delete the token ----------
    - name: Delete the token by team_id
      hashicorp.terraform.team_token:
        team_id: "{{ test_team_id }}"
        state: absent
      register: result_expiry_delete

    - name: Assert token was deleted
      ansible.builtin.assert:
        that:
          - result_expiry_delete.changed
          - "'deleted' in result_expiry_delete.msg"

  always:
    - name: Cleanup - delete named token by token_id if captured
      hashicorp.terraform.team_token:
        token_id: "{{ named_token_id }}"
        state: absent
      when:
        - named_token_id is defined
        - named_token_id | length > 0
      failed_when: false

    - name: Cleanup - delete team token if still present
      hashicorp.terraform.team_token:
        team_id: "{{ test_team_id }}"
        state: absent
      when:
        - test_team_id is defined
        - test_team_id | length > 0
      failed_when: false

    - name: Cleanup - delete test team
      hashicorp.terraform.team:
        team_id: "{{ test_team_id }}"
        state: absent
      when:
        - test_team_id is defined
        - test_team_id | length > 0
      failed_when: false
