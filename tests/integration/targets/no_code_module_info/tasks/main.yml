---
- name: Set module defaults
  module_defaults:
    group/hashicorp.terraform.terraform:
      tfe_token: "{{ tfc_token }}"

  block:
    - name: Generate a unique ID
      ansible.builtin.set_fact:
        unique_id: "{{ lookup('pipe', 'uuidgen') }}"

    - name: Generate unique names for test resources
      ansible.builtin.set_fact:
        ncm_info_module_name: "ncm-info-{{ unique_id[:8] }}"
        ncm_info_module_provider: "aws"

    # ---------- prerequisite: registry module + no-code module ----------
    - name: Create a registry module for the info test
      hashicorp.terraform.registry_module:
        organization: "{{ organization }}"
        name: "{{ ncm_info_module_name }}"
        provider: "{{ ncm_info_module_provider }}"
        registry_name: "private"
        state: present
      register: result_reg_module

    - name: Save registry module id
      ansible.builtin.set_fact:
        ncm_info_reg_module_id: "{{ result_reg_module.id }}"

    - name: Enable no-code provisioning for the info test
      hashicorp.terraform.no_code_module:
        organization: "{{ organization }}"
        registry_module_id: "{{ ncm_info_reg_module_id }}"
        enabled: true
        state: present
      register: result_create

    - name: Save no-code module id
      ansible.builtin.set_fact:
        ncm_info_no_code_module_id: "{{ result_create.id }}"

    # ---------- info: by id ----------
    - name: Retrieve the no-code module by id
      hashicorp.terraform.no_code_module_info:
        no_code_module_id: "{{ ncm_info_no_code_module_id }}"
      register: result_info

    - name: Assert info lookup returned the correct no-code module
      ansible.builtin.assert:
        that:
          - result_info.no_code_module.id == ncm_info_no_code_module_id
          - result_info.no_code_module.enabled == true
          - not result_info.changed

    # ---------- info: not found ----------
    - name: Retrieve a non-existent no-code module (should fail)
      hashicorp.terraform.no_code_module_info:
        no_code_module_id: "nocode-doesnotexist"
      register: result_info_missing
      ignore_errors: true

    - name: Assert not-found error is reported correctly
      ansible.builtin.assert:
        that:
          - result_info_missing.failed
          - "'not found' in result_info_missing.msg | lower"

  always:
    - name: Cleanup - best-effort delete no-code module
      hashicorp.terraform.no_code_module:
        no_code_module_id: "{{ ncm_info_no_code_module_id | default('') }}"
        state: absent
      when: ncm_info_no_code_module_id is defined and ncm_info_no_code_module_id | length > 0
      failed_when: false

    - name: Cleanup - best-effort delete the registry module
      hashicorp.terraform.registry_module:
        organization: "{{ organization }}"
        name: "{{ ncm_info_module_name | default('') }}"
        provider: "{{ ncm_info_module_provider | default('aws') }}"
        registry_name: "private"
        delete_scope: "provider"
        state: absent
      when: ncm_info_module_name is defined and ncm_info_module_name | length > 0
      failed_when: false
