---
# Integration tests for stack_deployment_step_info module.
#
# Stack deployment steps are created automatically when a deployment run
# executes — there is no direct create/delete API for them. These tests rely
# on a pre-existing deployment step ID supplied via the integration config.
#
# Required variables (set in tests/integration/integration_config.yml):
#   tfc_token                  - Terraform Cloud / TFE API token
#   stack_deployment_step_id   - An existing deployment step ID (sds-...)

- name: Set module defaults
  module_defaults:
    group/hashicorp.terraform.terraform:
      tfe_token: "{{ tfc_token }}"

  block:
    # info: read by ID
    - name: Read deployment step by ID
      hashicorp.terraform.stack_deployment_step_info:
        stack_deployment_step_id: "{{ stack_deployment_step_id }}"
      register: result_by_id

    - name: Assert read by ID succeeded
      ansible.builtin.assert:
        that:
          - not result_by_id.changed
          - result_by_id.stack_deployment_step.id == stack_deployment_step_id
          - result_by_id.stack_deployment_step.status is defined

    # info: not-found by ID raises an error
    - name: Read a non-existent deployment step by ID (expect failure)
      hashicorp.terraform.stack_deployment_step_info:
        stack_deployment_step_id: "sds-doesnotexist000"
      register: result_not_found
      ignore_errors: true

    - name: Assert not-found error was raised
      ansible.builtin.assert:
        that:
          - result_not_found is failed
          - "'not found' in result_not_found.msg"
