---
- name: Set module defaults
  module_defaults:
    group/hashicorp.terraform.terraform:
      tfe_token: "{{ tfc_token }}"

  block:
    - name: Generate a unique ID
      ansible.builtin.set_fact:
        unique_id: "{{ lookup('pipe', 'uuidgen') | lower }}"

    - name: Generate a unique policy set name
      ansible.builtin.set_fact:
        policy_set_name: "polset-param-test-{{ unique_id[:8] }}"

    # ---------- fixture: a policy set to attach parameters to ----------
    - name: Create a fixture policy set
      hashicorp.terraform.policy_set:
        organization: "{{ organization }}"
        name: "{{ policy_set_name }}"
        kind: sentinel
        global: false
        state: present
      register: result_policy_set

    - name: Save policy_set_id fact
      ansible.builtin.set_fact:
        policy_set_id: "{{ result_policy_set.id }}"

    # ---------- create ----------
    - name: Create a policy set parameter
      hashicorp.terraform.policy_set_parameter: &create_param
        policy_set_id: "{{ policy_set_id }}"
        key: "environment"
        value: "prod"
        state: present
      register: result_create

    - name: Assert parameter creation was successful
      ansible.builtin.assert:
        that:
          - result_create.changed
          - result_create.id is defined
          - result_create.key == "environment"
        # Note: result_create.value is not asserted here - `value` is no_log:
        # true on this module (it can hold sensitive parameter values), so
        # Ansible redacts any returned field matching the input value as
        # "VALUE_SPECIFIED_IN_NO_LOG_PARAMETER", by design.

    - name: Save parameter_id fact
      ansible.builtin.set_fact:
        parameter_id: "{{ result_create.id }}"

    # ---------- idempotent re-create ----------
    - name: Idempotency test - create the same parameter again
      hashicorp.terraform.policy_set_parameter: *create_param
      register: result_create_again

    - name: Assert re-create was a no-op
      ansible.builtin.assert:
        that:
          - not result_create_again.changed
          - result_create_again.id == parameter_id

    # ---------- update ----------
    - name: Update the parameter value by ID
      hashicorp.terraform.policy_set_parameter:
        policy_set_id: "{{ policy_set_id }}"
        parameter_id: "{{ parameter_id }}"
        value: "staging"
        state: present
      register: result_update

    - name: Assert update was applied
      ansible.builtin.assert:
        that:
          - result_update.changed

    # ---------- sensitive parameter is write-only, idempotent regardless ----------
    - name: Create a sensitive parameter
      hashicorp.terraform.policy_set_parameter:
        policy_set_id: "{{ policy_set_id }}"
        key: "api_key"
        value: "s3cr3t"
        sensitive: true
        state: present
      register: result_sensitive_create

    - name: Assert sensitive parameter creation was successful
      ansible.builtin.assert:
        that:
          - result_sensitive_create.changed
          - result_sensitive_create.sensitive

    - name: Re-apply the sensitive parameter with a different value (undetectable drift)
      hashicorp.terraform.policy_set_parameter:
        policy_set_id: "{{ policy_set_id }}"
        key: "api_key"
        value: "different-value"
        sensitive: true
        state: present
      register: result_sensitive_reapply

    - name: Assert sensitive value drift is not detected (documented limitation)
      ansible.builtin.assert:
        that:
          - not result_sensitive_reapply.changed

    # ---------- info lookups ----------
    - name: Look up the parameter by ID
      hashicorp.terraform.policy_set_parameter_info:
        policy_set_id: "{{ policy_set_id }}"
        parameter_id: "{{ parameter_id }}"
      register: result_info_by_id

    - name: Assert info-by-id matches
      ansible.builtin.assert:
        that:
          - result_info_by_id.parameter.id == parameter_id

    - name: Look up the parameter by key
      hashicorp.terraform.policy_set_parameter_info:
        policy_set_id: "{{ policy_set_id }}"
        key: "environment"
      register: result_info_by_key

    - name: Assert info-by-key matches
      ansible.builtin.assert:
        that:
          - result_info_by_key.parameter.id == parameter_id

    - name: List all parameters on the policy set
      hashicorp.terraform.policy_set_parameter_info:
        policy_set_id: "{{ policy_set_id }}"
      register: result_list

    - name: Assert both parameters appear in the list
      ansible.builtin.assert:
        that:
          - result_list.parameters | length == 2

    # ---------- absent ----------
    - name: Delete the parameter
      hashicorp.terraform.policy_set_parameter:
        policy_set_id: "{{ policy_set_id }}"
        parameter_id: "{{ parameter_id }}"
        state: absent
      register: result_delete

    - name: Assert delete was successful
      ansible.builtin.assert:
        that:
          - result_delete.changed

    - name: Delete the same parameter again (no-op)
      hashicorp.terraform.policy_set_parameter:
        policy_set_id: "{{ policy_set_id }}"
        parameter_id: "{{ parameter_id }}"
        state: absent
      register: result_delete_again

    - name: Assert second delete was a no-op
      ansible.builtin.assert:
        that:
          - not result_delete_again.changed

  always:
    - name: Cleanup - best-effort delete the fixture policy set (also removes its parameters)
      hashicorp.terraform.policy_set:
        organization: "{{ organization }}"
        name: "{{ policy_set_name }}"
        state: absent
      when: policy_set_name is defined
      failed_when: false
