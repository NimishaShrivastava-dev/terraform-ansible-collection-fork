---
- name: Set module defaults
  module_defaults:
    group/hashicorp.terraform.terraform:
      tfe_token: "{{ tfc_token }}"

  block:
    # ---------- precondition: ensure no pre-existing default token ----------
    - name: Precondition - delete default organization token if it already exists
      hashicorp.terraform.organization_token:
        organization: "{{ organization }}"
        state: absent
      failed_when: false

    # Default organization token lifecycle
    
    # ---------- check-mode create (token absent) ----------
    - name: Check-mode create - token is absent
      hashicorp.terraform.organization_token:
        organization: "{{ organization }}"
        state: present
      check_mode: true
      register: result_check_mode_create

    - name: Assert check-mode create reports would-be change without creating
      ansible.builtin.assert:
        that:
          - result_check_mode_create.changed
          - "'check mode' in result_check_mode_create.msg"
          - "'created' in result_check_mode_create.msg"

    - name: Verify no token was actually created by check-mode
      hashicorp.terraform.organization_token:
        organization: "{{ organization }}"
        state: absent
      register: result_after_check_mode_create

    - name: Assert token does not exist after check-mode create
      ansible.builtin.assert:
        that:
          - not result_after_check_mode_create.changed
          - "'absent' in result_after_check_mode_create.msg"

    # ---------- create ----------
    - name: Create the organization token
      hashicorp.terraform.organization_token:
        organization: "{{ organization }}"
        state: present
      register: result_create
      no_log: true

    - name: Assert token creation was successful
      ansible.builtin.assert:
        that:
          - result_create.changed
          - result_create.id is defined
          - result_create.created_at is defined

    - name: Save token id fact
      ansible.builtin.set_fact:
        token_id: "{{ result_create.id }}"

    # ---------- idempotent re-run ----------
    - name: Idempotency - present again, token already exists
      hashicorp.terraform.organization_token:
        organization: "{{ organization }}"
        state: present
      register: result_idempotent

    - name: Assert re-run is a no-op with the same token id
      ansible.builtin.assert:
        that:
          - not result_idempotent.changed
          - result_idempotent.id == token_id

    # ---------- check-mode delete ----------
    - name: Check-mode delete
      hashicorp.terraform.organization_token:
        organization: "{{ organization }}"
        state: absent
      check_mode: true
      register: result_check_mode_delete

    - name: Assert check-mode reports change but does not delete
      ansible.builtin.assert:
        that:
          - result_check_mode_delete.changed
          - "'check mode' in result_check_mode_delete.msg"

    - name: Verify token still exists after check-mode delete
      hashicorp.terraform.organization_token:
        organization: "{{ organization }}"
        state: present
      register: result_still_exists

    - name: Assert token was not actually deleted
      ansible.builtin.assert:
        that:
          - not result_still_exists.changed
          - result_still_exists.id == token_id

    # ---------- delete ----------
    - name: Delete the organization token
      hashicorp.terraform.organization_token:
        organization: "{{ organization }}"
        state: absent
      register: result_delete

    - name: Assert delete was successful
      ansible.builtin.assert:
        that:
          - result_delete.changed
          - "'deleted' in result_delete.msg"

    - name: Delete the token again (no-op)
      hashicorp.terraform.organization_token:
        organization: "{{ organization }}"
        state: absent
      register: result_delete_noop

    - name: Assert second delete is a no-op
      ansible.builtin.assert:
        that:
          - not result_delete_noop.changed
          - "'absent' in result_delete_noop.msg"

  
    # Audit Trails token lifecycle 
    

    # ---------- precondition: ensure no pre-existing audit-trails token ----------
    - name: Precondition - delete audit-trails token if it already exists
      hashicorp.terraform.organization_token:
        organization: "{{ organization }}"
        token_type: "audit-trails"
        state: absent
      failed_when: false

    # ---------- create audit-trails token ----------
    - name: Create the Audit Trails token
      hashicorp.terraform.organization_token:
        organization: "{{ organization }}"
        token_type: "audit-trails"
        state: present
      register: result_audit_create
      no_log: true

    - name: Assert Audit Trails token creation was successful
      ansible.builtin.assert:
        that:
          - result_audit_create.changed
          - result_audit_create.id is defined
          - result_audit_create.created_at is defined

    - name: Save audit-trails token id fact
      ansible.builtin.set_fact:
        audit_token_id: "{{ result_audit_create.id }}"

    # ---------- idempotent re-run ----------
    - name: Idempotency - Audit Trails present again, token already exists
      hashicorp.terraform.organization_token:
        organization: "{{ organization }}"
        token_type: "audit-trails"
        state: present
      register: result_audit_idempotent

    - name: Assert Audit Trails re-run is a no-op with the same token id
      ansible.builtin.assert:
        that:
          - not result_audit_idempotent.changed
          - result_audit_idempotent.id == audit_token_id

    # ---------- check-mode delete audit-trails ----------
    - name: Check-mode delete Audit Trails token
      hashicorp.terraform.organization_token:
        organization: "{{ organization }}"
        token_type: "audit-trails"
        state: absent
      check_mode: true
      register: result_audit_check_mode

    - name: Assert check-mode reports change but does not delete
      ansible.builtin.assert:
        that:
          - result_audit_check_mode.changed
          - "'check mode' in result_audit_check_mode.msg"

    - name: Verify Audit Trails token still exists after check-mode delete
      hashicorp.terraform.organization_token:
        organization: "{{ organization }}"
        token_type: "audit-trails"
        state: present
      register: result_audit_still_exists

    - name: Assert Audit Trails token was not actually deleted
      ansible.builtin.assert:
        that:
          - not result_audit_still_exists.changed
          - result_audit_still_exists.id == audit_token_id

    # ---------- delete audit-trails token ----------
    - name: Delete the Audit Trails token
      hashicorp.terraform.organization_token:
        organization: "{{ organization }}"
        token_type: "audit-trails"
        state: absent
      register: result_audit_delete

    - name: Assert Audit Trails delete was successful
      ansible.builtin.assert:
        that:
          - result_audit_delete.changed
          - "'deleted' in result_audit_delete.msg"

    - name: Delete the Audit Trails token again (no-op)
      hashicorp.terraform.organization_token:
        organization: "{{ organization }}"
        token_type: "audit-trails"
        state: absent
      register: result_audit_delete_noop

    - name: Assert second Audit Trails delete is a no-op
      ansible.builtin.assert:
        that:
          - not result_audit_delete_noop.changed
          - "'absent' in result_audit_delete_noop.msg"

  always:
    # Best-effort cleanup for both token types
    - name: Cleanup - delete default organization token
      hashicorp.terraform.organization_token:
        organization: "{{ organization }}"
        state: absent
      failed_when: false

    - name: Cleanup - delete Audit Trails token
      hashicorp.terraform.organization_token:
        organization: "{{ organization }}"
        token_type: "audit-trails"
        state: absent
      failed_when: false
