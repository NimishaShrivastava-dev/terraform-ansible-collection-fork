---
# Integration tests for stack_deployment_run_info module.
#
# Stack deployment runs are created automatically when a stack deploys — there
# is no direct create/delete API for them. These tests rely on a pre-existing
# deployment run ID supplied via the integration config.
#
# Required variables (set in tests/integration/integration_config.yml):
#   tfc_token              - Terraform Cloud / TFE API token
#   stack_deployment_run_id - An existing deployment run ID (sdr-...)

- name: Set module defaults
  module_defaults:
    group/hashicorp.terraform.terraform:
      tfe_token: "{{ tfc_token }}"

  block:
    # info: read by ID
    - name: Read deployment run by ID
      hashicorp.terraform.stack_deployment_run_info:
        stack_deployment_run_id: "{{ stack_deployment_run_id }}"
      register: result_by_id

    - name: Assert read by ID succeeded
      ansible.builtin.assert:
        that:
          - not result_by_id.changed
          - result_by_id.stack_deployment_run.id == stack_deployment_run_id
          - result_by_id.stack_deployment_run.status is defined

    # info: not-found by ID raises an error
    - name: Read a non-existent deployment run by ID (expect failure)
      hashicorp.terraform.stack_deployment_run_info:
        stack_deployment_run_id: "sdr-doesnotexist000"
      register: result_not_found
      ignore_errors: true

    - name: Assert not-found error was raised
      ansible.builtin.assert:
        that:
          - result_not_found is failed
          - "'not found' in result_not_found.msg"
