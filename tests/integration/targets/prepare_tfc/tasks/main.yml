- name: Set values
  ansible.builtin.set_fact:
    tfc_token: "{{ tfc_token | default(lookup('ansible.builtin.env', 'HCP_CI_TOKEN')) }}"
    organization: "{{ organization | default(lookup('ansible.builtin.env', 'HCP_CI_ORGANIZATION')) }}"
    test_agent_id: "{{ test_agent_id | default(lookup('ansible.builtin.env', 'HCP_CI_AGENT_ID')) }}"
  no_log: true
