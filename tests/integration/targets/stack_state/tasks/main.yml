---
# Integration tests for stack_state_info (read-only, by ID only).
#
# Prerequisites:
#   - stack_state_id: a valid, existing stack state ID (e.g. "sts-abc123")
#     must be supplied by the test inventory / extra-vars.
#   - tfc_token and organization are provided by the prepare_tfc dependency.
#
# This target exercises ONLY the read-by-ID operation.
# list(), download_description(), create, update, and delete are out of scope.

- name: Set module defaults
  module_defaults:
    group/hashicorp.terraform.terraform:
      tfe_token: "{{ tfc_token }}"

  block:
    # ---------- read by ID ----------
    - name: Retrieve stack state by ID
      hashicorp.terraform.stack_state_info:
        stack_state_id: "{{ stack_state_id }}"
      register: result_read

    - name: Assert read was successful and changed is false
      ansible.builtin.assert:
        that:
          - not result_read.changed
          - result_read.stack_state is defined
          - result_read.stack_state.id == stack_state_id

    - name: Assert expected fields are present in the result
      ansible.builtin.assert:
        that:
          - result_read.stack_state.generation is defined
          - result_read.stack_state.status is defined

    # ---------- idempotency: read again ----------
    - name: Re-read the same stack state (idempotency check)
      hashicorp.terraform.stack_state_info:
        stack_state_id: "{{ stack_state_id }}"
      register: result_read_again

    - name: Assert re-read returned the same result with changed=false
      ansible.builtin.assert:
        that:
          - not result_read_again.changed
          - result_read_again.stack_state.id == stack_state_id

    # ---------- check mode ----------
    - name: Read stack state in check mode
      hashicorp.terraform.stack_state_info:
        stack_state_id: "{{ stack_state_id }}"
      check_mode: true
      register: result_check_mode

    - name: Assert check mode returns state with changed=false
      ansible.builtin.assert:
        that:
          - not result_check_mode.changed
          - result_check_mode.stack_state.id == stack_state_id

    # ---------- nonexistent ID fails ----------
    - name: Attempt to read a nonexistent stack state (expect failure)
      hashicorp.terraform.stack_state_info:
        stack_state_id: "sts-00000000000000"
      register: result_not_found
      ignore_errors: true

    - name: Assert the module reported a 'not found' error
      ansible.builtin.assert:
        that:
          - result_not_found is failed
          - "'not found' in result_not_found.msg | lower"
