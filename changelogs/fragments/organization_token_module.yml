minor_changes:
  - >-
    organization_token - New module ``hashicorp.terraform.organization_token``
    to manage organization-scoped authentication tokens on Terraform Cloud and
    Terraform Enterprise. Supports creating, force-rotating, and deleting the
    default organization token or the HCP Terraform Audit Trails token
    (``token_type=audit-trails``). Accepts an optional ``expired_at`` expiry
    timestamp. Idempotent on ``state=present`` (no rotation unless
    ``force_rotate=true``) with full ``check_mode`` support.
